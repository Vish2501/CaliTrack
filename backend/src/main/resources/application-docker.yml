spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/calitrack}
    username: ${SPRING_DATASOURCE_USERNAME:calitrack}
    password: ${SPRING_DATASOURCE_PASSWORD:calitrack}

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:19092}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

calitrack:
  coach:
    async-enabled: ${COACH_ASYNC_ENABLED:true}

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
