spring:
  application:
    name: calitrack-backend

  # Load backend/.env locally (gitignored). Env vars still override file values.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Plain JSON with no Java class name header, so consumers don't depend on our classes.
        spring.json.add.type.headers: false
        # Fail within 5s instead of the default 60s when the broker is unreachable, since
        # sending happens on the request thread after the workout is saved.
        max.block.ms: 5000
    # Carry the trace context in Kafka headers, so the consumer continues the trace that the
    # finish-workout request started.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      auto-offset-reset: earliest
      # Wraps the JSON deserializer so a malformed message becomes an error the handler can send
      # to the DLT, instead of failing every poll on the same offset forever.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.calitrack.event.WorkoutLoggedEvent
        spring.json.use.type.headers: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

management:
  tracing:
    sampling:
      # Trace every request; traffic is tiny. Lower this if that ever changes.
      probability: 1.0
  # Spans are exported only when management.otlp.tracing.endpoint is set; Docker Compose sets it
  # to Jaeger. Without it, trace and span IDs still appear in every log line.

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

supabase:
  url: https://uzyjygnqzrfxgnijiufd.supabase.co
  jwt:
    issuer: https://uzyjygnqzrfxgnijiufd.supabase.co/auth/v1
    audience: authenticated
    jwk-set-uri: https://uzyjygnqzrfxgnijiufd.supabase.co/auth/v1/.well-known/jwks.json

# Secrets: set GEMINI_API_KEY (free from Google AI Studio) in your environment or backend/.env
gemini:
  api-key: ${GEMINI_API_KEY:}
  # Any free-tier Gemini model; Flash-Lite models usually have the highest free daily limits.
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  base-url: https://generativelanguage.googleapis.com/v1beta/openai

calitrack:
  coach:
    # Generate coach recommendations from WorkoutLogged events on Kafka.
    # Off unless a broker is running (docker-compose starts one for the docker profile).
    async-enabled: ${COACH_ASYNC_ENABLED:false}
    retry:
      initial-interval-ms: 1000
      max-retries: 3
    # Canned demo replies instead of Gemini (FakeCoachModelClient): true, false, or auto (demo replies
    # only when GEMINI_API_KEY is unset). Docker Compose uses auto; elsewhere it defaults to false.
    fake-model: ${COACH_FAKE_MODEL:false}
    fake-model-delay-ms: 3000
