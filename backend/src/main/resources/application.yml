spring:
  application:
    name: calitrack-backend

  # Load backend/.env locally (gitignored). Env vars still override file values.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Plain JSON with no Java class name header, so consumers don't depend on our classes.
        spring.json.add.type.headers: false
        # Fail within 5s instead of the default 60s when the broker is unreachable, since
        # sending happens on the request thread after the workout is saved.
        max.block.ms: 5000
    consumer:
      auto-offset-reset: earliest
      # Wraps the JSON deserializer so a malformed message becomes an error the handler can send
      # to the DLT, instead of failing every poll on the same offset forever.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.calitrack.event.WorkoutLoggedEvent
        spring.json.use.type.headers: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

supabase:
  url: https://uzyjygnqzrfxgnijiufd.supabase.co
  jwt:
    issuer: https://uzyjygnqzrfxgnijiufd.supabase.co/auth/v1
    audience: authenticated
    jwk-set-uri: https://uzyjygnqzrfxgnijiufd.supabase.co/auth/v1/.well-known/jwks.json

# Secrets: set OPENAI_API_KEY in your environment or backend/.env
openai:
  api-key: ${OPENAI_API_KEY:}

calitrack:
  coach:
    # Generate coach recommendations from WorkoutLogged events on Kafka.
    # Off unless a broker is running (docker-compose starts one for the docker profile).
    async-enabled: ${COACH_ASYNC_ENABLED:false}
    retry:
      initial-interval-ms: 1000
      max-retries: 3
